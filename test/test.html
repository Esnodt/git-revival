<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Тестовый вариант</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .wrapper 
        {
            display: grid;
           /* grid-template-columns: 1fr 1fr 1fr; худший вариант */
            grid-template-columns: repeat(3, 1fr);
            grid-auto-rows: minmax(100px, auto);
        }
        .wrapper div
        {
            border: 2px solid black ;
            margin: 5px;
            text-align: center;
            background: linear-gradient(to right, rgba(255, 0, 0, 0.149), rgba(0, 0, 255, 0.16));
            font-size: 50px
            

        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div>One one one one test rettfdgyfusdijfuisdanfiomasdofinmsdfnosmdp</div>
        <div>Two</div>
        <div>Three</div>
        <div>Four</div>
        <div>Five</div>
    </div>
</body>
</html>
